<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên Hệ - TechStore</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">TechStore</a>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Trang chủ</a></li>
                <li><a href="about.html" class="nav-link">Giới thiệu</a></li>
                <li><a href="products.html" class="nav-link">Sản phẩm</a></li>
                <li><a href="contact.html" class="nav-link active">Liên hệ</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Liên Hệ Với Chúng Tôi</h1>
        <div class="contact-container" style="margin-top: 2rem;">
            <div>
                <h2>Thông Tin Liên Hệ</h2>
                <p style="margin-top: 1rem;"><strong>Địa chỉ:</strong> 104 Nguyễn Văn Trỗi, Quận Phú Nhuận, TP. Hồ Chí Minh</p>
                <p><strong>Email:</strong> contact@pmnstore.com</p>
                <p><strong>Điện thoại:</strong> 0357 830 907</p>
            </div>
            
            <form>
                <div class="form-group">
                    <label for="fullname">Họ và Tên</label>
                    <input type="text" id="fullname" placeholder="Nhập họ và tên..." required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Nhập email..." required>
                </div>
                <div class="form-group">
                    <label for="message">Nội Dung</label>
                    <textarea id="message" rows="5" placeholder="Nhập nội dung tin nhắn..." required></textarea>
                </div>
                <button type="submit" class="btn">Gửi Liên Hệ</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 PMNStore. Nguồn hình ảnh minh họa từ <a href="https://placeholder.com" target="_blank" rel="noopener">Placeholder</a>.</p>
    </footer>
</body>
</html>
