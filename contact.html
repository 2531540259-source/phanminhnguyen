<main class="contact-section">
  <h1 class="page-title">Liên Hệ Với Chúng Tôi</h1>

  <div class="contact-grid">
    <!-- Cột trái: Thông tin liên hệ -->
    <div class="contact-info">
      <h2>Thông Tin Liên Hệ</h2>
      <p>📍 <strong>Địa chỉ:</strong> 104 Nguyễn Văn Trỗi, Quận Phú Nhuận, TP. Hồ Chí Minh</p>
      <p>📧 <strong>Email:</strong> minhnguyen@gmail.com</p>
      <p>📞 <strong>Điện thoại:</strong> 0357 830 907</p>
      <p>⏰ <strong>Giờ làm việc:</strong> 8:00 - 21:00 (Thứ 2 - Chủ Nhật)</p>
      
      <div style="margin-top: 15px; overflow: hidden; border-radius: 8px;">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3919.2312345678!2d106.6789!3d10.7912!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMTA0IE5ndXnhu4VuIFbEg24gVHLhu5dp!5e0!3m2!1svi!2s!4v1234567890" width="100%" height="200" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
      </div>
    </div>

    <!-- Cột phải: Form gửi tin nhắn -->
    <div class="contact-form-card">
      <h2>Gửi Tin Nhắn</h2>
      <form>
        <div class="form-group">
          <label for="fullname">Họ và Tên</label>
          <input type="text" id="fullname" placeholder="Nhập họ và tên...">
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Nhập email...">
        </div>

        <div class="form-group">
          <label for="message">Nội Dung</label>
          <textarea id="message" rows="4" placeholder="Nhập nội dung tin nhắn..."></textarea>
        </div>

        <button type="submit" class="btn-submit">Gửi Liên Hệ</button>
      </form>
    </div>
  </div>
</main>
