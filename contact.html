<main class="contact-section">
  <h1 class="page-title">Liên Hệ Với Chúng Tôi</h1>
  
  <div class="contact-grid">
    <!-- Cột 1: Thông tin liên hệ & Bản đồ -->
    <div class="contact-info">
      <h2>Thông Tin Liên Hệ</h2>
      <p><strong>📍 Địa chỉ:</strong> 104 Nguyễn Văn Trỗi, Quận Phú Nhuận, TP. Hồ Chí Minh</p>
      <p><strong>✉️ Email:</strong> minhnguyen@gmail.com</p>
      <p><strong>📞 Điện thoại:</strong> 0357 830 907</p>
      <p><strong>⏰ Giờ làm việc:</strong> 8:00 - 21:00 (Thứ 2 - Chủ Nhật)</p>

      <!-- Bản đồ Google Maps -->
      <div class="map-box">
        <iframe 
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3919.261907577884!2d106.67789181156553!3d10.791242358872295!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x317528d25d19bf77%3A0x86f1e8a846c4f090!2s104%20Nguy%E1%BB%85n%20V%C2%A3n%20Tr%E1%BB%97i%2C%20Ph%C6%B0%E1%BB%9Dng%208%2C%20Ph%C3%BA%20Nhu%E1%BA%ADn%2C%20H%E1%BB%93%20Ch%C3%AD%20Minh!5e0!3m2!1svi!2svn!4v1700000000000!5m2!1svi!2svn" 
          width="100%" 
          height="200" 
          style="border:0; border-radius: 10px; margin-top: 15px;" 
          allowfullscreen="" 
          loading="lazy">
        </iframe>
      </div>
    </div>

    <!-- Cột 2: Form gửi tin nhắn -->
    <div class="contact-form-card">
      <h2>Gửi Tin Nhắn</h2>
      <form action="#" method="POST">
        <div class="form-group">
          <label for="name">Họ và Tên</label>
          <input type="text" id="name" placeholder="Nhập họ và tên..." required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Nhập email..." required>
        </div>
        <div class="form-group">
          <label for="message">Nội Dung</label>
          <textarea id="message" rows="4" placeholder="Nhập nội dung tin nhắn..." required></textarea>
        </div>
        <button type="submit" class="btn-submit">Gửi Liên Hệ</button>
      </form>
    </div>
  </div>
</main>
